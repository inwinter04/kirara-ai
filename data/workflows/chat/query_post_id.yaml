name: 查询帖子ID工作流
description: 查询并回复用户"当前帖子的ID为：xxx"
blocks:
  - type: internal:get_message
    name: get_message
    params: {}
    position:
      x: 100
      y: 100
    connected_to:
      - target: query_post_id_code
        mapping:
          from: sender
          to: sender
      - target: send_response
        mapping:
          from: sender
          to: target
  - type: internal:code
    name: query_post_id_code
    params:
      inputs:
        - name: sender
          label: 发送者
      outputs:
        - name: result
          label: 查询结果
      code: "def execute(sender, **kwargs):\n    post_id = sender.raw_metadata.get('post_id', '未知')\n    result = f\"当前帖子的ID为：{post_id}\"\n    return {\"result\": result}\n"
    position:
      x: 495
      y: 525
    connected_to:
      - target: text_to_msg
        mapping:
          from: result
          to: text
  - type: internal:send_message
    name: send_response
    params:
      im_name: 小赫
    position:
      x: 1091
      y: 388
  - type: internal:text_to_im_message
    name: text_to_msg
    params: {}
    position:
      x: 650
      y: 133
    connected_to:
      - target: send_response
        mapping:
          from: msg
          to: msg
config:
  max_execution_time: 3600
